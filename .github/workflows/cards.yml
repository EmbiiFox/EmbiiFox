name: Update profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 07:17 Vietnam time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.svg
          git diff --cached --quiet || (git commit -m "Update profile cards" && git push)
